name: MirTimeItems
version: '3.2.0'
main: ru.mirtime.items.MirTimeItems
api-version: '1.21'
authors: [Ars3nBar, MirTime]
description: Уникальные артефакты, киты и Ядро Армагеддона для анархии MIR-TIME 3.0
softdepend:
  - WorldGuard
  - WorldEdit
  - Vault
  - GemsEconomy
  - PlaceholderAPI

commands:
  mtitems:
    description: Каталог и выдача уникальных артефактов MIR-TIME
    aliases: [items, mti, артефакты]
    usage: /mtitems <gui|give>

permissions:
  mirtime.items.admin:
    description: Доступ к выдаче артефактов и взятию предметов из /mtitems gui
    default: op
